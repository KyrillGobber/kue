# Profiles are groups of data you can easily switch between. A common usage is
# to define profiles for various environments of a REST service
profiles:
  example:
    name: Kue at home
    data:
      host: https://192.168.1.219

requests:
  getlights: !request
    name: Get lights
    method: GET
    headers:
      hue-application-key: 1zUztGOp6k4Z7K1Krz2RJHlbHEpMYkcjTbmfdrL3
    url: "{{host}}/clip/v2/resource/light"
